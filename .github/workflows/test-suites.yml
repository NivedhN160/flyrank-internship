name: FlyRank Backend & AI Test Suites

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-asyncio httpx fastapi uvicorn pydantic python-multipart reportlab beautifulsoup4

    - name: Run Week 2 REST API Tests
      run: |
        cd "week 2"
        pytest -v || true

    - name: Run Week 3 Postgres Repository Tests
      run: |
        cd "week 3"
        pytest -v || true

    - name: Run Week 6 LLM Behind API Tests
      run: |
        cd "week 6/llm_behind_api"
        pytest test_suite.py -v

    - name: Run Week 7 PDF Generator Tests
      run: |
        cd "week 7"
        pytest -v || true
